<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Edit Record</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Sports Equipment Management System</h1>
        <p>Name: ABIN SHAJI THOMAS &nbsp;|&nbsp; Reg No: URK24CS6007</p>
    </header>

    <section>
        {% if table == 'equipment' %}
        <h2>Edit Equipment #{{ row.equipment_id }}</h2>
        <form action="{{ url_for('update_equipment', id=row.equipment_id) }}" method="post" class="edit">
            <label>Name <input name="name" value="{{ row.name }}" required></label>
            <label>Category <input name="category" value="{{ row.category }}" required></label>
            <label>Quantity <input name="quantity" type="number" min="0" value="{{ row.quantity }}" required></label>
            <label>Condition <input name="condition" value="{{ row.condition }}" required></label>
            <button type="submit">Save</button>
            <a href="{{ url_for('index') }}">Cancel</a>
        </form>
        {% else %}
        <h2>Edit Issue Record #{{ row.issue_id }}</h2>
        <form action="{{ url_for('update_issue', id=row.issue_id) }}" method="post" class="edit">
            <label>Equipment
                <select name="equipment_id" required>
                    {% for e in equipment %}
                    <option value="{{ e.equipment_id }}" {% if e.equipment_id == row.equipment_id %}selected{% endif %}>{{ e.equipment_id }} - {{ e.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Issued To <input name="issued_to" value="{{ row.issued_to }}" required></label>
            <label>Issue Date <input name="issue_date" type="date" value="{{ row.issue_date }}" required></label>
            <label>Return Date <input name="return_date" type="date" value="{{ row.return_date or '' }}"></label>
            <button type="submit">Save</button>
            <a href="{{ url_for('index') }}">Cancel</a>
        </form>
        {% endif %}
    </section>
</body>
</html>
